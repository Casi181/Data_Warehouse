[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casi-financial-dw"
version = "1.0.0"
description = "Acme Ltd Financial Data Warehouse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cassandra-driver>=3.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "mcp>=1.0.0",
    "pyspark>=3.5.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
